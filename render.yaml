services:
  - type: web
    name: elite-event-hub
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm start --workspace=server
    envVars:
      - key: DB_HOST
        scope: run
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        scope: run
        sync: false
      - key: DB_USER
        scope: run
        sync: false
      - key: DB_PASSWORD
        scope: run
        sync: false
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_SERVER_CERT
        value: "true"
      - key: JWT_SECRET
        scope: run
        sync: false
      - key: STRIPE_SECRET_KEY
        scope: run
        sync: false
      - key: FRONTEND_URL
        value: ${RENDER_EXTERNAL_URL}
