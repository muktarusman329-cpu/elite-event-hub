services:
  - type: web
    name: elite-event-hub
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1
    envVars:
      - key: DB_HOST
        scope: run
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        scope: run
        sync: false
      - key: DB_USER
        scope: run
        sync: false
      - key: DB_PASSWORD
        scope: run
        sync: false
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_SERVER_CERT
        value: "true"
      - key: JWT_SECRET
        scope: run
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        scope: run
        sync: false
      - key: PAYSTACK_SECRET_KEY
        scope: run
        sync: false
      - key: FRONTEND_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: API_BASE_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: PUBLIC_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        scope: run
        sync: false
      - key: ADMIN_PASSWORD
        scope: run
        sync: false
      - key: GOOGLE_CLIENT_ID
        scope: run
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        scope: run
        sync: false
