services:
  - type: web
    name: elite-event-hub
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build --workspace=client
    startCommand: npm start --workspace=server
    envVars:
      - key: MONGODB_URI
        scope: run
        sync: false
      - key: JWT_SECRET
        scope: run
        sync: false
      - key: STRIPE_SECRET_KEY
        scope: run
        sync: false
      - key: FRONTEND_URL
        value: ${RENDER_EXTERNAL_URL}
